# Server Configuration
server.port=8080
server.address=127.0.0.1

# Application Configuration
spring.application.name=novel-reader

# Database Configuration
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:novel_reader.db
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=com.github.gwenn.sqlite.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# File Storage Configuration
novel.storage.base-path=./novel-storage
novel.storage.chapter-ext=.txt
novel.storage.max-filename-length=100

# Chapter Split Configuration
chapter.split.pattern=?[????????????????????????\\d\\s]*?[\\s]*[^\\n]*
chapter.split.min-chapter-length=500
chapter.split.max-title-length=100

# CORS Configuration (for local development)
cors.allowed-origins=http://localhost:8080